include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Performance & Const Usage
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    avoid_redundant_argument_values: true
    
    # Code Consistency
    avoid_print: true
    prefer_single_quotes: true
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    
    # Style & Readability
    sort_child_properties_last: true
    # require_trailing_commas is deliberately off: it fights the Dart 3.7+
    # formatter, which removes the very commas the rule then demands back.
    # `dart format` is the authority on formatting here.
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    unnecessary_this: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    
    # Safety
    prefer_null_aware_operators: true
    use_build_context_synchronously: true
    avoid_types_as_parameter_names: true
    avoid_dynamic_calls: true
    
    # Best Practices
    use_key_in_widget_constructors: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_full_hex_values_for_flutter_colors: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    invalid_annotation_target: ignore
    avoid_dynamic_calls: error
    # Deliberately an info, not an error, on the 1.2.x line.
    #
    # Flutter 3.47 deprecated `package:flutter/material.dart` itself in favour
    # of `package:material_ui`. This line is built on the former on purpose —
    # migrating is a breaking change for every consumer, and is what 2.0.0 is
    # for — so every file reports this one deprecation and nothing here can
    # act on it. Escalated to `error` it buried the deprecations that *can*
    # be acted on, and made `dart analyze` report 51 errors to pub.dev for a
    # package that has none.
    deprecated_member_use: info
    use_build_context_synchronously: error
    avoid_print: error